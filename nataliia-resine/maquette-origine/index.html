.hero-tab-mark{display:grid;place-items:center;flex:0 0 25px;width:25px;height:25px;border:1px solid #d7a650;border-radius:50%;color:#f1c879;font-family:Arial,sans-serif;font-size:17px;}

.hero-tab-mark{width:24px;height:24px;flex-basis:24px;font-size:13px;}
