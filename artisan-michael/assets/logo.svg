<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 116" role="img" aria-label="Logo Michael Rénovation">
  <!-- Logo fictif (maquette). Toit = couverture, carreaux avec joints = carrelage, fond lisse = plâtrerie.
       Chaque élément a une classe pour l'animation future (pose carreau par carreau). -->
  <path class="lg-roof" d="M4 30 L48 6 L92 30" fill="none" stroke="#E8582A" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
  <g class="lg-tiles" fill="#141517">
    <rect class="lg-t" x="0"  y="40"  width="16" height="16"/>
    <rect class="lg-t" x="80" y="40"  width="16" height="16"/>
    <rect class="lg-t" x="0"  y="60"  width="16" height="16"/>
    <rect class="lg-t" x="20" y="60"  width="16" height="16"/>
    <rect class="lg-t" x="60" y="60"  width="16" height="16"/>
    <rect class="lg-t" x="80" y="60"  width="16" height="16"/>
    <rect class="lg-t" x="0"  y="80"  width="16" height="16"/>
    <rect class="lg-t lg-accent" x="40" y="80" width="16" height="16" fill="#E8582A"/>
    <rect class="lg-t" x="80" y="80"  width="16" height="16"/>
    <rect class="lg-t" x="0"  y="100" width="16" height="16"/>
    <rect class="lg-t" x="80" y="100" width="16" height="16"/>
  </g>
</svg>
