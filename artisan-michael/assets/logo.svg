<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 116" role="img" aria-label="Logo LOGE&amp;NERJ">
  <!-- Logo fictif (maquette). L et N en carreaux avec joints (carrelage) sous un toit (couverture), fond lisse (plâtrerie).
       Chaque carreau a la classe lg-t, le toit lg-roof : prévu pour l'animation (pose carreau par carreau). -->
  <path class="lg-roof" d="M4 30 L68 4 L132 30" fill="none" stroke="#E8582A" stroke-width="8" stroke-linecap="square"/>
  <g class="lg-tiles" fill="#141517"><rect class="lg-t" x="0" y="40" width="16" height="16"/><rect class="lg-t" x="0" y="60" width="16" height="16"/><rect class="lg-t" x="0" y="80" width="16" height="16"/><rect class="lg-t" x="0" y="100" width="16" height="16"/><rect class="lg-t" x="20" y="100" width="16" height="16"/><rect class="lg-t" x="60" y="40" width="16" height="16"/><rect class="lg-t" x="60" y="60" width="16" height="16"/><rect class="lg-t" x="60" y="80" width="16" height="16"/><rect class="lg-t" x="60" y="100" width="16" height="16"/><rect class="lg-t lg-accent" x="80" y="60" width="16" height="16" fill="#E8582A"/><rect class="lg-t" x="100" y="80" width="16" height="16"/><rect class="lg-t" x="120" y="40" width="16" height="16"/><rect class="lg-t" x="120" y="60" width="16" height="16"/><rect class="lg-t" x="120" y="80" width="16" height="16"/><rect class="lg-t" x="120" y="100" width="16" height="16"/></g>
</svg>
