name: Deploy client sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Guillaume l'Échanson à la racine, Nataliia Résine dans /nataliia-resine/
      - name: Assemble sites
        run: |
          mkdir -p _site
          cp -r guillaume-echanson/. _site/
          mkdir -p _site/nataliia-resine
          cp -r nataliia-resine/www/. _site/nataliia-resine/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
