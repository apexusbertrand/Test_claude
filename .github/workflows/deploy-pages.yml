name: Déploiement GitHub Pages

# Déploie le site statique (le jeu Quarto) sur GitHub Pages.
on:
  push:
    branches: ["claude/quarto-game-0cpq2v"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler un déploiement en cours.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Pages (activation automatique)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
