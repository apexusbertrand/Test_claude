name: Apexus Cleaner — APK Android

on:
  push:
    paths:
      - "android-storage-cleaner/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-storage-cleaner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est préinstallé sur les runners ubuntu-latest (ANDROID_HOME).
      - name: Licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Construction de l'APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Préparation de l'APK
        run: cp app/build/outputs/apk/debug/apexus-cleaner-debug.apk apexus-cleaner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apexus-cleaner-apk
          path: android-storage-cleaner/apexus-cleaner.apk
          if-no-files-found: error

      # Publie l'APK dans une release à lien fixe :
      # https://github.com/<dépôt>/releases/download/apexus-cleaner-latest/apexus-cleaner.apk
      - name: Publication (release « apexus-cleaner-latest »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apexus-cleaner-latest --cleanup-tag --yes || true
          gh release create apexus-cleaner-latest apexus-cleaner.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Apexus Cleaner — dernière version de test" \
            --notes "APK de test (debug) construit automatiquement depuis la branche ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. Installation : autoriser les sources inconnues sur le téléphone."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports-de-tests
          path: android-storage-cleaner/app/build/reports/
